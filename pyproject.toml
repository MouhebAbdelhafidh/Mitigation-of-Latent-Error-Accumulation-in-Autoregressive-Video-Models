[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lntr"
version = "0.1.0"
description = "Latent Noise-Scheduled Trajectory Regularization for Autoregressive World Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "einops>=0.7.0",
    "h5py>=3.11.0",
    "PyYAML>=6.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8.0",
    "tensorboard>=2.16.0"
]